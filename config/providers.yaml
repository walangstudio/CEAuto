# CEAuto — LLM Provider Configuration
# Set API keys via environment variables (preferred) or inline (not recommended for production)

# Default provider for all agents unless overridden below
default_provider: anthropic

# Provider configurations
providers:
  anthropic:
    default_model: claude-sonnet-4-6
    # api_key: sk-ant-...  # Set ANTHROPIC_API_KEY env var instead

  openai:
    default_model: gpt-4o
    # api_key: sk-...  # Set OPENAI_API_KEY env var instead

  google:
    default_model: gemini-1.5-pro
    # api_key: ...  # Set GOOGLE_API_KEY env var instead

  ollama:
    default_model: llama3
    base_url: http://localhost:11434

# Per-agent provider override (optional)
# agent_providers:
#   researcher: anthropic
#   coder: anthropic
#   analyst: openai
#   writer: anthropic
#   ops: anthropic
#   security: anthropic
#   comms: anthropic

# Per-agent model override (optional)
# model_per_agent:
#   researcher: claude-opus-4-6
#   coder: claude-sonnet-4-6
#   analyst: gpt-4o

# ── Cost control ──────────────────────────────────────────────────────────────
# Model pricing in USD per 1K tokens. `default` is used for unknown models.
pricing:
  default: { input: 0.003, output: 0.015 }
  claude-sonnet-4-6: { input: 0.003, output: 0.015 }
  claude-opus-4-8: { input: 0.015, output: 0.075 }
  claude-haiku-4-5-20251001: { input: 0.001, output: 0.005 }
  gpt-4o: { input: 0.005, output: 0.015 }
  gemini-1.5-pro: { input: 0.00125, output: 0.005 }
  llama3: { input: 0, output: 0 }
  mock-model: { input: 0, output: 0 }

# Hard spend caps. A breach pauses autonomous execution and opens an approval.
budgets:
  per_agent_daily_tokens: 200000
  per_session_tokens: 100000
  global_daily_tokens: 2000000
  global_daily_usd: 25

# CEO Agent Configuration

## General
name: "Autonomous CEO Agent"
version: "1.0.0"
framework: "MCP-compatible"

## Autonomy
autonomy:
  max_retries_per_agent: 3
  retry_backoff_seconds: 30
  auto_escalate_after_retries: true
  require_approval_for:
    - shell_commands
    - external_communications
    - file_deletion
    - config_changes
  # Self-evaluation feedback loop
  self_evaluate: true
  eval_threshold: 3
  max_eval_retries: 2
  # Approval cost gate (USD) — estimated spend above this needs sign-off
  approval_cost_threshold_usd: 5
  # Heartbeat (consumed by bin/ceauto-daemon.js)
  heartbeat_cron: "*/15 * * * *"
  max_tasks_per_cycle: 3
  per_heartbeat_token_budget: 40000
  daily_token_budget: 2000000
  # Inter-agent delegation (Pillar 5) — bound runaway fan-out.
  max_delegation_depth: 3      # how deep a subtask chain may go
  max_subtasks_per_task: 5     # max children one task may spawn

## Executors (Pillar 1) — how each agent's work is actually run.
## Default is `llm`. Map an agent to `shell` or `mcp-tool` to use another runtime;
## shell is allowlist-gated (empty allowlist = blocked).
executors:
  default: llm
  by_agent: {}        # e.g. { ops: shell, research-bot: mcp-tool }
  agent_params: {}    # e.g. { ops: { command: node, args: ["worker.js"] } }
  shell:
    allowlist: []     # basenames permitted, e.g. ["node", "git"]

## Session
session:
  boot_timeout_seconds: 60
  max_tasks_per_session: 10
  generate_standup_on_boot: true

## Reporting
reporting:
  archive_completed_monthly: true
  keep_agent_logs_days: 30
  default_standup_path: "reports/daily-standup.md"

## Task Management
tasks:
  backlog_file: "tasks/backlog.md"
  in_progress_file: "tasks/in-progress.md"
  blocked_file: "tasks/blocked.md"
  done_file: "tasks/done.md"

## Memory
memory:
  decisions_file: "memory/decisions.md"
  context_file: "memory/context.md"
  open_questions_file: "memory/open-questions.md"
  agent_logs_file: "memory/agent-logs.md"
  persona_file: "ceo-core/persona.md"

## Communication
comms:
  directives_file: "comms/directives.md"
  escalations_file: "comms/escalations.md"
  vetos_file: "comms/vetos.md"

## Sub-Agents
agents:
  researcher:
    name: "Research Agent"
    capability: "research"
    definition: "subagents/researcher.md"
  coder:
    name: "Coder Agent"
    capability: "coding"
    definition: "subagents/coder.md"
  analyst:
    name: "Data Analyst"
    capability: "analysis"
    definition: "subagents/analyst.md"
  writer:
    name: "Writer Agent"
    capability: "writing"
    definition: "subagents/writer.md"

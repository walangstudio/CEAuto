# CEO Agent Configuration

## General
name: "Autonomous CEO Agent"
version: "0.17.0"
framework: "MCP-compatible"

## Autonomy
autonomy:
  max_retries_per_agent: 3
  retry_backoff_seconds: 30
  auto_escalate_after_retries: true
  require_approval_for:
    - shell_commands
    - external_communications
    - file_deletion
    - config_changes
  # Self-evaluation feedback loop
  self_evaluate: true
  eval_threshold: 3
  max_eval_retries: 2
  # Approval cost gate (USD) — estimated spend above this needs sign-off
  approval_cost_threshold_usd: 5
  # Heartbeat (consumed by bin/ceauto-daemon.js)
  heartbeat_cron: "*/15 * * * *"
  max_tasks_per_cycle: 3
  per_heartbeat_token_budget: 40000
  daily_token_budget: 2000000
  # Inter-agent delegation (Pillar 5) — bound runaway fan-out.
  max_delegation_depth: 3      # how deep a subtask chain may go
  max_subtasks_per_task: 5     # max children one task may spawn

  # Pursue goals autonomously (lib/strategist.js). When the ready queue is idle,
  # turn strategy/goals.md + priorities.md into the next tasks so the daemon keeps
  # working toward your goals instead of just draining what you hand it.
  pursue_goals: false               # master switch (default OFF)
  auto_run_generated: false         # false = generated tasks need approval first (dry-run); true = run them
  max_generated_tasks_per_day: 10   # hard cap on tasks the strategist may originate / 24h
  max_plans_per_day: 24             # hard cap on planning CALLS/24h (bounds spend even on zero-yield plans)
  strategy_min_interval_minutes: 30 # cooldown so it can't re-plan (and re-spend) every cycle
  max_tasks_per_plan: 5             # fan-out cap per planning call
  strategy_agent: analyst           # whose persona/budget the planning call uses
  # Kill switch: create a file at comms/STOP to halt ALL dispatch immediately
  # (checked at cycle start and before each task); delete it to resume.

## Executors (Pillar 1 + G1) — how each agent's work is actually run.
## Default is `llm`. Map an agent to another runtime via by_agent; the high-blast-
## radius ones (shell, webhook, claude-code) are gated and default-off.
##   llm | shell | mcp-tool | webhook (http-webhook) | claude-code | composite
## `composite` runs an ordered list of executors as one task (mode: chain|map):
##   agent_params: { builder: { mode: chain, steps: [ { executor: llm },
##                                                     { executor: shell, params: { command: node, args: ["build.js"] } } ] } }
executors:
  default: llm
  by_agent: {}        # e.g. { ops: shell, research-bot: mcp-tool, builder: composite }
  agent_params: {}    # e.g. { ops: { command: node, args: ["worker.js"] } }
  # Executors that require a human approval before a task may run through them,
  # even if the task wasn't flagged needs_approval. Empty = opt-in (unchanged).
  # Recommended for unattended daemons: [shell, webhook, http-webhook, claude-code, mcp-tool]
  require_approval: []
  shell:
    allowlist: []     # basenames permitted, e.g. ["node", "git"]
  webhook:
    allowlist: []     # outbound hosts permitted, e.g. ["worker.internal", "n8n.example.com"]
  mcp-tool:
    allowlist: []     # command basenames permitted (empty = allow; non-empty locks it down)
  claude_code:
    enabled: false    # default OFF — claude-code can edit files; enable deliberately
    command: claude   # the Claude Code CLI binary
    # outputFormat: json   # parse { result, usage } from `claude -p --output-format json`
  # Codex CLI (`codex exec`, prompt on stdin) — the OpenAI-plan sibling of claude_code.
  # Both bill your SUBSCRIPTION rather than per-token API credits, so the loop can run
  # real coding work with no API key. Default OFF (it can run commands / edit files).
  codex:
    enabled: false    # default OFF — enable deliberately
    command: codex    # the Codex CLI binary
    # args: [exec, --skip-git-repo-check, --color, never]      # the default
    # args: [exec, --skip-git-repo-check, --color, never, --sandbox, workspace-write]  # let it write
    # cwd: F:/path/to/a/sandbox   # give it a scratch working root, not your main repo
    # passApiKeys: false  # keys are stripped from the child env so billing stays on your
    #                     # PLAN; set true only if you deliberately run the CLI API-backed
    # CAVEAT: your own ~/.codex/config.toml can widen sandbox/approvals globally — the
    # "no bypass flag injected" guarantee only covers the argv CEAuto builds.

## Reactive sources (Pillar 4, G1) — feed the queue from outside the cron tick.
## Master switch + per-source switch, all default-off (new inbound surface).
sources:
  enabled: false
  file_watch:
    enabled: false
    paths: []            # dirs/globs to watch; a change creates a task
    agent: ops
    auto_approve: false  # externally-triggered tasks need a human ack by default; true = run autonomously
  webhook:
    enabled: false
    host: "127.0.0.1"    # local-first; do not bind 0.0.0.0 without a proxy
    port: 8787
    secret: ""           # required X-CEAuto-Secret header (empty = no auth — keep local)
    agent: ops
    auto_approve: false  # inbound-webhook tasks need a human ack by default; true = run autonomously
  mention:
    map: {}              # @alias -> agent override, e.g. { eng: coder }

## Read-only local dashboard (Pillar 7, G2). `npm run dashboard`, or started by
## the daemon when enabled. Local-first: binds 127.0.0.1. No writes, pure view.
dashboard:
  enabled: false
  host: "127.0.0.1"
  port: 8788

## Dispatch policy (Pillar 6) — when on, the runner routes each task to the
## cheapest model that has historically cleared the bar for that agent
## (learning.recommendDispatch, fed by evals ⋈ ledger). Default OFF: until you
## opt in, the configured provider/model is used. Falls back to config when
## there isn't enough signal yet. Inspect with ceo_insights.
dispatch:
  auto_route: false
  min_samples: 3       # need at least this many scored runs on a model to trust it
  min_success: 0.6     # and at least this success rate (eval >= pass score)
  explore_epsilon: 0   # 0 = exploit only. >0 (e.g. 0.1) = with that probability re-sample an
                       # abandoned/under-sampled model, so a recovered or newly-cheaper one can be rediscovered.

## Governance (G2). Policy-as-code lives in config/policy.yaml (see
## config/policy.yaml.example). Absent → the autonomy.* gates above apply.

## Session
session:
  boot_timeout_seconds: 60
  max_tasks_per_session: 10
  generate_standup_on_boot: true

## Reporting
reporting:
  archive_completed_monthly: true
  keep_agent_logs_days: 30
  default_standup_path: "reports/daily-standup.md"

## Task Management
tasks:
  backlog_file: "tasks/backlog.md"
  in_progress_file: "tasks/in-progress.md"
  blocked_file: "tasks/blocked.md"
  done_file: "tasks/done.md"

## Memory
memory:
  decisions_file: "memory/decisions.md"
  context_file: "memory/context.md"
  open_questions_file: "memory/open-questions.md"
  agent_logs_file: "memory/agent-logs.md"
  persona_file: "ceo-core/persona.md"

## Communication
comms:
  directives_file: "comms/directives.md"
  escalations_file: "comms/escalations.md"
  vetos_file: "comms/vetos.md"

## Sub-Agents
agents:
  researcher:
    name: "Research Agent"
    capability: "research"
    definition: "subagents/researcher.md"
  coder:
    name: "Coder Agent"
    capability: "coding"
    definition: "subagents/coder.md"
  analyst:
    name: "Data Analyst"
    capability: "analysis"
    definition: "subagents/analyst.md"
  writer:
    name: "Writer Agent"
    capability: "writing"
    definition: "subagents/writer.md"
  ops:
    name: "Ops Agent"
    capability: "operations"
    definition: "subagents/ops.md"
  security:
    name: "Security Agent"
    capability: "security"
    definition: "subagents/security.md"
  comms:
    name: "Comms Agent"
    capability: "communications"
    definition: "subagents/comms.md"
